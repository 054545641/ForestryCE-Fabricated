}

tasks.named('runN2PeerServer') {
    doFirst {
        def dir = file('run/26.2/n2-peer')
        dir.mkdirs()
        new File(dir, 'n2-peer.passed').delete()
    }
    doLast {
        if (!file('run/26.2/n2-peer/n2-peer.passed').exists()) throw new GradleException('N2 peer assertions did not complete')
