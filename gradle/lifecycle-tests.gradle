// The watchdog and unattended fixture ticks must keep running without connected players.
tasks.matching { it.name in ['runN2TestServer', 'runN2PeerServer'] }.configureEach {
    doFirst {
        def dir = file(name == 'runN2PeerServer' ? 'run/26.2/n2-peer' : 'run/26.2/n2-server')
        dir.mkdirs()
        def properties = new File(dir, 'server.properties')
        def values = new Properties()
        if (properties.exists()) properties.withInputStream { values.load(it) }
        values.setProperty('pause-when-empty-seconds', '0')
        if (!properties.exists()) {
            values.setProperty('server-ip', '127.0.0.1')
            values.setProperty('online-mode', 'false')
            values.setProperty('level-name', name == 'runN2PeerServer' ? 'n2-peer' : 'n2-acceptance')
            values.setProperty('level-type', 'minecraft:flat')
            values.setProperty('generate-structures', 'false')
            values.setProperty('view-distance', '4')
            values.setProperty('simulation-distance', '4')
            values.setProperty('spawn-protection', '0')
            values.setProperty('max-players', '2')
        }
        properties.withOutputStream { values.store(it, 'Isolated N2 acceptance server') }
    }
}
