// Resource-only client probe: no production module is excluded from the real build.
if (providers.gradleProperty('environmentMailAssets').orElse('false').get().toBoolean()) {
    tasks.named('processResources') {
        from(rootProject.file('src/mail/resources')) { include 'assets/forestry/models/**', 'assets/forestry/textures/**' }
        from(rootProject.file('src/generated/resources_mail')) { include 'assets/forestry/models/**', 'assets/forestry/items/**' }
        from(rootProject.file('src/generated/resources')) { include 'assets/forestry/atlases/gui.json' }
        from(rootProject.file('src/main/resources')) {
            include 'assets/minecraft/atlases/gui.json', 'assets/forestry/textures/forestry/atlas/gui/**'
        }
    }
}

if (providers.gradleProperty('environmentN5Models').orElse('false').get().toBoolean()) {
    tasks.named('processResources') {
        from(file('src/n5ModelResources'))
        from(rootProject.file('src/generated/resources')) {
            include 'assets/forestry/items/*_boat.json', 'assets/forestry/items/*_sign.json'
            include 'assets/forestry/models/item/*_boat.json', 'assets/forestry/models/item/*_sign.json'
            include 'assets/forestry/models/block/*sign*.json'
            include 'assets/minecraft/atlases/blocks.json'
        }
        from(rootProject.file('src/generated/resources')) {
            include 'assets/forestry/blockstates/*_sign.json'
            eachFile { details -> details.path = details.path.replace('assets/forestry/blockstates/', 'assets/forestry_environment/blockstates/') }
        }
        from(rootProject.file('src/main/resources')) {
            include 'assets/forestry/models/block/template_legacy_*sign*.json', 'assets/minecraft/atlases/blocks.json'
            include 'assets/forestry/textures/gui/signs/**', 'assets/forestry/textures/gui/hanging_signs/**'
            include 'assets/forestry/textures/entity/boat/**', 'assets/forestry/textures/entity/chest_boat/**', 'assets/forestry/textures/entity/signs/**'
            include 'assets/forestry/textures/item/*_boat.png', 'assets/forestry/textures/item/*_sign.png'
            include 'assets/forestry/textures/item/*_sapling.png'
            include 'assets/forestry/textures/block/*_planks.png', 'assets/forestry/textures/block/stripped_*_log.png'
        }
        def machines = ['peat_engine','biogas_engine','clockwork_engine','combustion_engine','solar_engine','rainmaker','apiarists_chest','arborists_chest','lepidopterists_chest']
        from(rootProject.file('src/generated/resources')) {
            machines.each { include "assets/forestry/items/" + it + ".json" }
        }
        from(rootProject.file('src/main/resources')) {
            machines.each { include "assets/forestry/models/item/" + it + ".json" }
            include 'assets/forestry/textures/block/engine_*', 'assets/forestry/textures/block/rainmaker*'
            include 'assets/forestry/textures/block/*chest.png', 'assets/forestry/textures/block/*_chest.0.png'
        }
        from(rootProject.file('src/generated/resources')) {
            include 'assets/forestry/items/can.json', 'assets/forestry/items/wax_capsule.json', 'assets/forestry/items/refractory_capsule.json'
            include 'assets/forestry/items/crated_grass_block.json', 'assets/forestry/items/crated_apatite.json'
            include 'assets/forestry/models/item/filled_crate.json', 'assets/forestry/models/item/crated_grass_block.json', 'assets/forestry/models/item/crated_apatite.json'
        }
        from(rootProject.file('src/main/resources')) {
            include 'assets/forestry/textures/item/filled_crate.png', 'assets/forestry/textures/item/apatite.png', 'assets/forestry/textures/item/liquids/**'
        }
    }
}
