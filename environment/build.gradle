plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

version = '0.0.0-environment-only'
base.archivesName = 'forestry-environment-26.2'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.forgeVersion
    accessTransformers = files(rootProject.file('src/main/resources/META-INF/accesstransformer.cfg'))
    validateAccessTransformers = true
    mods {
        forestry_environment { sourceSet sourceSets.main }
    }
    runs {
        configureEach {
            gameDirectory = rootProject.layout.projectDirectory.dir('run/26.2/environment/' + name)
        }
        client {
            client()
            systemProperty 'forestry.environment.n5Models', providers.gradleProperty('environmentN5Models').orElse('false').get()
            systemProperty 'forestry.environment.mailAssets', providers.gradleProperty('environmentMailAssets').orElse('false').get()
            systemProperty 'forestry.environment.autoExit', providers.gradleProperty('environmentAutoExit').orElse('false').get()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            clientData()
            systemProperty 'forestry.environment.mailAssetRoot', rootProject.projectDir.absolutePath
            programArguments.addAll '--mod', 'forestry_environment', '--all', '--output', file('build/generated').absolutePath
        }
        gameTestServer { type = 'gameTestServer' }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

