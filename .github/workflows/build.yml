name: Fabric 26.2 F3

on:
  workflow_dispatch:
  push:
    branches: ['26.2-fabric']
  pull_request:
    branches: ['26.2-fabric']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build four jars and verify isolation
        run: bash gradlew build gametestClasses -PwithJade=false -PwithJei=false --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forestry-fabric-f3-build
          path: |
            build/fabric-26.2/libs/
            build/fabric-26.2/reports/
            build/fabric-26.2/generated/f3-resources/resource-report.json
  datagen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Native Fabric datagen and deterministic resource diff
        run: bash gradlew checkFabricDatagen -PwithJade=false -PwithJei=false --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forestry-fabric-f3-datagen
          path: build/fabric-26.2/reports/f3/datagen.json
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        modules: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify installed modules, registration, loot, recipes and component codecs
        run: bash gradlew runGameTest -PforestryModules=${{ matrix.modules }} -PwithJade=false -PwithJei=false --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forestry-fabric-f3-server-${{ matrix.modules }}
          path: run/fabric-26.2/f2-gametest-${{ matrix.modules }}/logs/
  dedicated-server:
    if: vars.MINECRAFT_EULA_ACCEPTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        modules: [0, 7]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply repository owner's explicit EULA consent
        run: |
          mkdir -p run/fabric-26.2/server-${{ matrix.modules }}
          printf 'eula=true\n' > run/fabric-26.2/server-${{ matrix.modules }}/eula.txt
          printf 'server-ip=127.0.0.1\nonline-mode=true\n' > run/fabric-26.2/server-${{ matrix.modules }}/server.properties
      - name: Start and save normal server without optional integrations
        run: |
          bash gradlew runServer -PforestryModules=${{ matrix.modules }} -PserverAutoExit=true -PwithJade=false -PwithJei=false --console=plain | tee dedicated.log
          grep -q FORESTRY_F2_SERVER_READY dedicated.log
          grep -q 'All dimensions are saved' dedicated.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forestry-fabric-f3-dedicated-${{ matrix.modules }}
          path: |
            dedicated.log
            run/fabric-26.2/server-${{ matrix.modules }}/logs/
