name: Release for 1.21.1

on:
  push:
    branches: [ '1.21.1' ]
  workflow_dispatch:

permissions:
  contents: read

cache-mode: none

jobs:
  release:
    name: Publish release JAR for Forestry
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/1.21.1' && startsWith(github.event.head_commit.message, '[Release]')
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          # avoid uploading downloaded third-party binaries to GitHub Actions caches
          cache-disabled: true

      - name: Upload to CurseForge
        run: ./gradlew curseforge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

      - name: Upload to Modrinth
        run: ./gradlew modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
